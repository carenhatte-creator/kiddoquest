<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KinderQuest Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="container">

        <section class="login-card">

            <!-- LOGO -->
            <div class="logo-area">
                <img
                    src="image/logo.png"
                    class="logo"
                    alt="KinderQuest Logo"
                >
            </div>

            <!-- TITLE -->
            <div class="login-heading">
                <h1>Teacher Login</h1>

                <p>Sign in to continue</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- USERNAME -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginSubmitBtn">
                    Login
                </button>

            </form>


            <!-- LOGIN MESSAGE -->
            <div
                id="loginMessage"
                class="message">
            </div>


            <!-- REGISTER -->
            <div class="register-section">

                <p class="register-text">
                    Don't have an account?
                </p>

                <a
                    href="register.html"
                    class="register-btn">
                    Register Here
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
