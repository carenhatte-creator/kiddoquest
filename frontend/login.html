<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiddoquest Login</title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="container">

        <section class="login-card">

            <!-- LOGO -->
            <div class="logo-area">
                <img
                    src="image/logo.png"
                    class="logo"
                    alt="KinderQuest Logo"
                >
            </div>

            <!-- TITLE -->
            <div class="login-heading">
                <h1>Teacher Login</h1>

                <p>Sign in to continue</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- USERNAME -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                    <a href="forgot-password.html" class="forgot-password-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginSubmitBtn">
                    Login
                </button>

            </form>


            <!-- LOGIN MESSAGE -->
            <div
                id="loginMessage"
                class="message">
            </div>


            <!-- REGISTER -->
            <div class="register-section">

                <p class="register-text">
                    Don't have an account?
                </p>

                <a
                    href="register.html"
                    class="register-btn">
                    Register Here
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
