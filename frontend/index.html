<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KinderQuest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="splash">

        <div class="hero-content">

            <!-- KINDERQUEST LOGO -->
            <img
                src="image/logo.png"
                class="logo"
                alt="KinderQuest Logo"
            >

            <!-- MAIN TITLE -->
            <h1>
                An Interactive Learning Game
            </h1>

            <!-- TAGLINE -->
            <p class="tagline">
                🌈 Learn • Play • Grow 🌈
            </p>

            <!-- START BUTTON -->
            <button
                id="startBtn"
                type="button"
            >
                Start Adventure
            </button>

        </div>

    </main>


    <script>
        document.getElementById("startBtn").addEventListener("click", function () {
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
