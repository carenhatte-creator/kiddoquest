<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KinderQuest Alphabet Games</title>

    <link rel="stylesheet" href="game-css/game.css">

</head>

<body>

    <!-- HEADER -->

    <header class="game-header">

        <a href="../minigames.html" class="back-btn">
            ← Back
        </a>

        <h1>🔤 Alphabet Games</h1>

    </header>


    <!-- GAME LIST -->

    <div class="game-list">


        <!-- LETTER MATCHING -->

        <div class="activity-card">

            <div class="icon">
                🔤
            </div>

            <h2>Letter Matching</h2>

            <p>
                Match uppercase and lowercase letters.
            </p>

            <button onclick="startGame('letter-matching')">
                ▶ Play
            </button>

        </div>


        <!-- LETTER SORT -->

        <div class="activity-card">

            <div class="icon">
                ✏️
            </div>

            <h2>Letter Sort</h2>

            <p>
                Sort the letters in the correct order.
            </p>

            <button onclick="startGame('letter-sort')">
                ▶ Play
            </button>

        </div>


        <!-- DRAG & DROP LETTERS -->

        <div class="activity-card">

            <div class="icon">
                🧩
            </div>

            <h2>Drag & Drop Letters</h2>

            <p>
                Drag letters to the correct position.
            </p>

            <button onclick="startGame('drag-drop')">
                ▶ Play
            </button>

        </div>


        <!-- LETTER MEMORY -->

        <div class="activity-card">

            <div class="icon">
                🧠
            </div>

            <h2>Letter Memory</h2>

            <p>
                Find the matching letter pairs.
            </p>

            <button onclick="startGame('letter-memory')">
                ▶ Play
            </button>

        </div>


    </div>


    <script src="../js/soundManager.js"></script>
    <script src="games-js/alphabet.js"></script>

</body>

</html>
