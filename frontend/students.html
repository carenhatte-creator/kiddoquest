<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KiddoQuest Students</title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         STUDENTS CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/students.css"
    >


    <!-- ==================================================
         SHARED SIDEBAR CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/sidebar.css"
    >

</head>


<body>


<div class="dashboard-container">


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <!-- ==================================================
             LOGO
        ================================================== -->

        <div class="brand">

            <img
                src="image/logo.png"
                alt="KiddoQuest Logo"
            >

        </div>



        <!-- ==================================================
             TEACHER
        ================================================== -->

        <div class="teacher">

            <div class="teacher-avatar-wrap">

                <div
                    id="sidebarAvatar"
                    class="sidebar-avatar"
                >
                    T
                </div>


                <img
                    id="sidebarAvatarImg"
                    class="sidebar-avatar-img"
                    alt="Teacher"
                    hidden
                >

            </div>


            <span id="teacherName">
                Teacher
            </span>

        </div>



        <!-- ==================================================
             NAVIGATION
        ================================================== -->

        <nav>


            <!-- DASHBOARD -->

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    Dashboard
                </span>

            </a>



            <!-- STUDENTS -->

            <a
                href="students.html"
                class="active"
            >

                <i class="fa-solid fa-users"></i>

                <span>
                    Students
                </span>

            </a>



            <!-- MINI GAMES -->

            <a href="minigames.html">

                <i class="fa-solid fa-gamepad"></i>

                <span>
                    Mini Games
                </span>

            </a>



            <!-- PROGRESS -->

            <a href="progress.html">

                <i class="fa-solid fa-chart-simple"></i>

                <span>
                    Progress
                </span>

            </a>



            <!-- REPORTS -->

            <a href="reports.html">

                <i class="fa-regular fa-file-lines"></i>

                <span>
                    Reports
                </span>

            </a>



            <!-- SETTINGS -->

            <a href="settings.html">

                <i class="fa-solid fa-gear"></i>

                <span>
                    Settings
                </span>

            </a>



            <!-- LOGOUT -->

            <a
                href="#"
                id="logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Logout
                </span>

            </a>


        </nav>


    </aside>





    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main">


        <!-- ==================================================
             HEADER
        ================================================== -->

        <div class="header">


            <div>

                <h1>

                    <i class="fa-solid fa-users"></i>
                    Student Management

                </h1>


                <p>

                    Manage Your Students

                </p>

            </div>



            <!-- ADD STUDENT -->

            <button
                id="openAdd"
            >

                <i class="fa-solid fa-user-plus"></i>
                Add Student

            </button>


        </div>





        <!-- ==================================================
             SEARCH
        ================================================== -->

        <div class="search-box">


            <input
                type="text"
                id="search"
                placeholder="🔍 Search student..."
            >


        </div>





        <!-- ==================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
        ></div>





        <!-- ==================================================
             STUDENT TABLE
        ================================================== -->

        <table>


            <thead>


                <tr>


                    <th>

                        No.

                    </th>


                    <th>

                        Name

                    </th>


                    <th>

                        Age

                    </th>


                    <th>

                        Gender

                    </th>


                    <th>

                        Action

                    </th>


                </tr>


            </thead>



            <tbody
                id="studentTable"
            >

            </tbody>


        </table>





        <!-- ==================================================
             ADD STUDENT MODAL
        ================================================== -->

        <div
            class="modal"
            id="studentModal"
        >


            <div class="modal-content">


                <h2>

                    <i class="fa-solid fa-user-plus"></i>
                    Add Student

                </h2>



                <input
                    type="text"
                    id="first_name"
                    placeholder="First Name"
                >



                <input
                    type="text"
                    id="last_name"
                    placeholder="Last Name"
                >



                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                >



                <select
                    id="gender"
                >


                    <option value="">

                        Select Gender

                    </option>



                    <option value="Male">

                        Male

                    </option>



                    <option value="Female">

                        Female

                    </option>


                </select>



                <button
                    id="saveStudent"
                >

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Student

                </button>



                <button
                    id="closeModal"
                >

                    <i class="fa-solid fa-xmark"></i>
                    Cancel

                </button>


            </div>


        </div>





        <!-- ==================================================
             DELETE CONFIRM MODAL
        ================================================== -->

        <div
            class="modal"
            id="deleteModal"
        >


            <div class="modal-content">


                <h2>

                    <i class="fa-solid fa-trash"></i>
                    Delete Student

                </h2>



                <p>

                    Are you sure you want to delete this student?

                </p>



                <button
                    id="confirmDeleteBtn"
                >

                    <i class="fa-solid fa-trash"></i>
                    Yes, Delete

                </button>



                <button
                    id="cancelDeleteBtn"
                >

                    <i class="fa-solid fa-xmark"></i>
                    Cancel

                </button>


            </div>


        </div>


    </main>


</div>





<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script src="js/logout.js"></script>

<script src="js/students.js"></script>


</body>

</html>
